}

.daily-suggest-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--bg);
  border: none;
  color: var(--muted);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.daily-suggest-close:hover {
  background: var(--border);
  color: var(--text);
}

.daily-suggest-hd {
  font-size: 15px;
  font-weight: 800;
  color: var(--primary-d);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.daily-suggest-body {
  font-size: 13.5px;
  color: var(--text-soft);
  line-height: 1.6;
  margin-bottom: 16px;
}
.daily-suggest-body b {
  color: var(--amber-text);
  font-weight: 800;
}

.daily-suggest-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}

.daily-suggest-later,
.daily-suggest-go {
  padding: 8px 18px;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
  border: none;
}

.daily-suggest-later {
  background: var(--bg);
  color: var(--text-soft);
}
.daily-suggest-later:hover {
  background: var(--border);
}

.daily-suggest-go {
  background: var(--primary);
  color: #fff !important;
}
.daily-suggest-go:hover {
  background: var(--primary-d);
}

/* 2. 底部鼓励浮窗 (替换原来的内联样式) */
.daily-cheer {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  border: 2px solid var(--primary);
  border-radius: var(--r-pill);
  padding: 12px 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 9999;
  animation: slideUpFade .3s cubic-bezier(.34,1.3,.64,1);
  white-space: nowrap;
  max-width: 95vw;
}

.daily-cheer span {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.daily-cheer b {
  color: var(--primary-d);
  font-size: 16px;
}

.daily-cheer-actions {
  display: flex;
  gap: 8px;
}

.daily-cheer-btn {
  padding: 6px 14px;
  border-radius: var(--r-pill);
  font-size: 12.5px;
  font-weight: 700;
  border: none;
  cursor: pointer;
}
.daily-cheer-rest {
  background: var(--border-soft);
  color: var(--text-soft);
}
.daily-cheer-go {
  background: var(--primary);
  color: #fff !important;
}

/* 动画 */
@keyframes slideInRight {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes slideUpFade {
  from { opacity: 0; transform: translate(-50%, 20px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}
/* 3. 今日完成居中弹窗 */
.daily-complete-mask {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, .5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10010;
  padding: 20px;
  animation: fadeIn .18s;
}

.daily-complete-card {
  background: var(--card);
  border-radius: var(--r-card);
  padding: 32px 28px 24px;
  width: 380px;
  max-width: 92vw;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
}

.daily-complete-emoji {
  font-size: 56px;
  margin-bottom: 12px;
}
.daily-complete-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--green-text);
  margin-bottom: 12px;
}
.daily-complete-body {
  font-size: 14px;
  color: var(--text-soft);
  line-height: 1.8;
  margin-bottom: 24px;
}
.daily-complete-body b {
  color: var(--primary);
  font-size: 16px;
}

.daily-complete-actions {
  display: flex;
  gap: 12px;
}
.daily-complete-rest,
.daily-complete-go {
  flex: 1;
  padding: 12px;
  border-radius: var(--r-pill);
  font-weight: 700;
  font-size: 14px;
  border: none;
  cursor: pointer;
}
.daily-complete-rest {
  background: var(--bg);
  color: var(--text-soft);
}
.daily-complete-rest:hover {
  background: var(--border);
}
.daily-complete-go {
  background: var(--primary);
  color: #fff !important;
}
.daily-complete-go:hover {
  background: var(--primary-d);
}

/* ============================================================
   ⭐ 云端同步与登录配置弹窗 (Sync Setup Modal)
   ============================================================ */
.sync-modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10020;
  padding: 20px;
  animation: fadeIn .18s;
}

.sync-modal {
  background: var(--card);
  border-radius: var(--r-card);
  padding: 24px 26px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
  width: 400px;
  max-width: 92vw;
  max-height: 90vh;
  overflow-y: auto;
  font-family: inherit;
  color: var(--text);
}

/* 标题与描述 */
.sync-modal h3 {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 8px;
  color: var(--text);
}
.sync-modal p {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 16px;
}
.sync-modal p b {
  color: var(--primary-d);
}

/* 输入框 */
.sync-modal label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-soft);
  margin-bottom: 6px;
}
.sync-modal input {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 14px;
  margin-bottom: 16px;
  outline: none;
  font-family: inherit;
  background: var(--input-bg) !important;
  color: var(--text) !important;
  transition: border-color .15s;
}
.sync-modal input:focus {
  border-color: var(--primary) !important;
  box-shadow: 0 0 0 3px var(--primary-soft) !important;
}

/* 错误提示 */
.sync-modal .sb-err {
  color: var(--red-text);
  font-size: 13px;
  min-height: 18px;
  margin-bottom: 8px;
  font-weight: 600;
}

/* 账号信息卡片 */
.sync-acc-card {
  background: var(--bg);
  border-radius: var(--r-sm);
  padding: 14px 16px;
  margin-bottom: 14px;
  border: 1px solid var(--border-soft);
}
.sync-acc-card .label {
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
  margin-bottom: 4px;
}
.sync-acc-card .email {
  font-size: 15px;
  font-weight: 800;
  color: var(--text);
  word-break: break-all;
  margin-bottom: 8px;
}
.sync-acc-card .uid {
  font-size: 11px;
  color: var(--muted);
  font-family: ui-monospace, monospace;
  word-break: break-all;
}

/* 警告提示 */
.sync-warning {
  background: var(--amber-soft);
  border: 1.5px dashed var(--amber-text);
  border-radius: var(--r-sm);
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: 13px;
  color: var(--amber-text);
  line-height: 1.7;
}

/* 底部按钮组 */
.sync-btn-row {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 12px;
}
.sync-btn {
  padding: 10px 18px;
  border-radius: var(--r-pill);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  border: none;
  transition: all .15s;
  width: 100%;
  margin-bottom: 8px;
}
.sync-btn-primary {
  background: var(--secondary);
  color: #fff !important;
  box-shadow: 0 3px 0 rgba(0,0,0,0.1);
}
.sync-btn-primary:active {
  transform: translateY(2px);
  box-shadow: none;
}
.sync-btn-secondary {
  background: var(--bg);
  border: 1.5px solid var(--border);
  color: var(--text-soft);
}
.sync-btn-secondary:hover {
  border-color: var(--primary);
  color: var(--primary-d);
}
.sync-btn-danger {
  background: var(--card);
  border: 1.5px solid var(--red-soft);
  color: var(--red-text);
}
.sync-btn-danger:hover {
  border-color: var(--red-text);
  background: var(--red-soft);
}

/* 登录验证码 */
.sync-modal .code-input {
  font-size: 22px;
  font-weight: 800;
  text-align: center;
  letter-spacing: 6px;
  font-family: ui-monospace, monospace;
}

/* ============================================================
   ⭐ 会话恢复提示条 (Session Backup Bar)
   ============================================================ */
.backup-restore-bar {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: 90vw;
  background: var(--card);
  border: 2px solid var(--amber-text);
  border-radius: var(--r-sm);
  padding: 12px 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 10020;
  font-size: 14px;
  font-weight: 700;
  color: var(--amber-text);
  animation: slideUpFade .3s cubic-bezier(.34,1.3,.64,1);
}

.backup-restore-bar button {
  padding: 6px 16px;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: all .15s;
}

/* 忽略按钮 */
.backup-restore-bar .backup-restore-no {
  background: var(--bg);
  color: var(--text-soft);
  border: 1px solid var(--border);
}
.backup-restore-bar .backup-restore-no:hover {
  background: var(--border);
}

/* 恢复按钮 */
.backup-restore-bar .backup-restore-yes {
  background: var(--amber-text);
  color: #fff !important;
}
.backup-restore-bar .backup-restore-yes:hover {
  filter: brightness(0.95);
}

/* 适配移动端 */
@media (max-width: 600px) {
  .backup-restore-bar {
    flex-direction: column;
    gap: 12px;
    text-align: center;
  }
  .backup-restore-bar button {
    width: 100%;
    padding: 10px;
  }
}
</style>
</head>
<body>

<div class="app-header" id="globalHeader">
  <h1 id="appTitle">🎓 数学互动课堂</h1>
  <p>动 手 操 作 · 即 时 反 馈 · 发 现 规 律</p>
</div>

<div id="page-home" class="page active"></div>

<div id="page-lesson" class="page">
  <div id="lessonHeader" class="lesson-header"></div>
  <div id="lessonProgress" class="lesson-progress"></div>
  <div id="lessonLevels" class="lesson-levels is-hidden"></div>
  <div id="modulePool" class="lesson-stage">
    <main id="lesson-stage-main">
      <!-- ========================================================
           模块模板（tpl-m1 ~ m14）
           ======================================================== -->
      <!-- ① 混合运算 -->
      <template id="tpl-m1">
        <div class="card">
          <h2>① 混合运算 · 步步为营</h2>
          <details class="lesson-hint">
            <summary>💡 不会做？点我看提示</summary>
            <p>先算乘除，后算加减。点击算式中的运算符，把它先算出来。</p>
          </details>

          <div class="problem-bar">
            <select id="m1Select"></select>
            <button class="btn" id="m1Load">📥 载入</button>
            <input type="text" id="m1Custom" placeholder="或输入算式，如：12 × 3 + 15">
            <button class="btn-secondary" id="m1UseCustom">使用</button>
            <label class="file-btn">📎 上传 txt<input type="file" id="m1Upload" accept=".txt" hidden></label>
            <button class="btn-secondary" id="m1Random">🎲 随机出题</button>
          </div>

          <div class="expr-box"><div class="expr" id="m1expr"></div></div>

          <div id="m1PriorityBox" class="priority-box" style="display:none;">
            <div class="priority-label">🤔 想一想：这道题应该先算哪一步？</div>
            <div class="priority-options" id="m1PriorityOptions"></div>
            <div id="m1PriorityFeedback" class="priority-feedback"></div>
          </div>

          <div class="steps-box" id="m1steps"></div>
          <div class="feedback" id="m1fb">点击算式中的运算符，把它先算出来 👆</div>
          <div class="btn-row">
            <button class="btn-secondary" id="m1reset">🔄 重来一次</button>
          </div>
        </div>
      </template>

      <!-- ② 乘法面积 -->
      <template id="tpl-m2">
        <div class="card">
          <h2>② 多位数乘一位数 · 铺地砖</h2>
          <details class="lesson-hint">
            <summary>💡 不会做？点我看提示</summary>
            <p>一块一块地铺满地面，看看 12 × 3 到底是怎么算出来的。</p>
          </details>
          <div class="controls">
            <label>每行 <input type="range" id="m2a" min="11" max="25" value="12"> <span class="val" id="m2aval">12</span> 块</label>
            <label>共 <input type="range" id="m2b" min="2" max="6" value="3"> <span class="val" id="m2bval">3</span> 行</label>
          </div>
          <canvas id="m2canvas" width="720" height="420"></canvas>
          <div class="btn-row" style="justify-content:center;">
            <button class="btn" id="m2fill">🧱 铺一行</button>
            <button class="btn-secondary" id="m2split">✂️ 拆分模式</button>
            <button class="btn-secondary" id="m2clear">🔄 重来</button>
          </div>
          <div class="calc-display" id="m2calc"></div>
        </div>
      </template>

      <!-- ③ 分数披萨 -->
      <template id="tpl-m3">
        <div class="card">
          <h2>③ 分数的初步认识 · 披萨分一分</h2>
          <details class="lesson-hint">
            <summary>💡 不会做？点我看提示</summary>
            <p>拖动滑块改变份数，点击披萨上的每一块来"取走"它。</p>
          </details>
          <div class="controls" style="justify-content:center;margin-bottom:22px;">
            <label>平均分成 <input type="range" id="m3denRange" min="2" max="12" value="4"> <span class="val" id="m3denval">4</span> 份</label>
          </div>
          <div class="frac-wrap">
            <canvas id="m3canvas" width="340" height="340"></canvas>
            <div class="frac-info">
              <div class="frac"><span id="m3num">0</span><span class="line"></span><span id="m3denText">4</span></div>
              <div class="frac-text" id="m3text">还没有选任何一份</div>
            </div>
          </div>
          <div class="frac-extra">
            <div class="frac-extra-tabs">
              <button class="frac-tab active" data-frac-mode="compare">⚖️ 比大小</button>
              <button class="frac-tab" data-frac-mode="add">➕ 分数加法</button>
              <button class="frac-tab" data-frac-mode="sub">➖ 分数减法</button>
              <button class="frac-tab" data-frac-mode="equiv">🟰 等值分数</button>
            </div>
            <div id="fracExtraContent" class="frac-extra-content"></div>
          </div>
          <div class="btn-row" style="justify-content:center;">
            <button class="btn-secondary" id="m3clear">🔄 清空重选</button>
          </div>
        </div>
      </template>

      <!-- ④ 长度单位 -->
      <template id="tpl-m4">
        <div class="card">
          <h2>④ 毫米、分米和千米 · 单位换算器</h2>
          <details class="lesson-hint">
            <summary>💡 不会做？点我看提示</summary>
            <p>长度单位每相邻两个之间都是 10 倍关系（千米和米之间是 1000 倍）。</p>
          </details>
          <div class="ladder">
            <div class="rung"><span class="unit-name">千米</span><span class="unit-sym">km</span></div>
            <div class="arrow-row">↓ × 1000 &nbsp;&nbsp; ↑ ÷ 1000</div>
            <div class="rung"><span class="unit-name">米</span><span class="unit-sym">m</span></div>
            <div class="arrow-row">↓ × 10 &nbsp;&nbsp; ↑ ÷ 10</div>
            <div class="rung"><span class="unit-name">分米</span><span class="unit-sym">dm</span></div>
            <div class="arrow-row">↓ × 10 &nbsp;&nbsp; ↑ ÷ 10</div>
            <div class="rung"><span class="unit-name">厘米</span><span class="unit-sym">cm</span></div>
            <div class="arrow-row">↓ × 10 &nbsp;&nbsp; ↑ ÷ 10</div>
            <div class="rung"><span class="unit-name">毫米</span><span class="unit-sym">mm</span></div>
          </div>
          <div class="converter">
            <input type="text" inputmode="decimal" id="m4val" value="3">
            <select id="m4unit">
              <option value="km">千米</option><option value="m" selected>米</option>
              <option value="dm">分米</option><option value="cm">厘米</option>
              <option value="mm">毫米</option>
            </select>
            <span style="font-size:16px;font-weight:700;color:var(--muted);">= ?</span>
          </div>
          <div class="result-list" id="m4results"></div>
          <div class="quiz-box">
            <div class="quiz-q" id="m4quizq">点击下方按钮开始小测</div>
            <div class="quiz-row">
              <button class="btn" id="m4newq">🎲 出题</button>
              <input type="text" inputmode="decimal" id="m4answer" placeholder="答案">
              <button class="btn-secondary" id="m4check">✔ 检查</button>
            </div>
            <div class="feedback" id="m4fb" style="margin-top:14px;display:none;"></div>
          </div>
        </div>
      </template>

      <!-- ⑤ 面积周长 -->
      <template id="tpl-m5">
        <div class="card">
          <h2>⑤ 长方形和正方形的面积 · 围栏与地砖</h2>
          <details class="lesson-hint">
            <summary>💡 不会做？点我看提示</summary>
            <p>拖动滑块改变长和宽，观察面积和周长各自怎么变化。</p>
          </details>
          <div class="controls" style="justify-content:center;">
            <label>长 <input type="range" id="m5w" min="1" max="10" value="5"> <span class="val" id="m5wval">5</span></label>
            <label>宽 <input type="range" id="m5h" min="1" max="10" value="3"> <span class="val" id="m5hval">3</span></label>
          </div>
          <div class="grid-wrap"><div class="grid" id="m5grid"></div></div>
          <div class="stats">
            <div class="stat area"><div class="label">面积（方块数）</div><div class="value" id="m5area">15</div></div>
            <div class="stat perim"><div class="label">周长（边线长）</div><div class="value" id="m5perim">16</div></div>
          </div>
          <div class="btn-row" style="justify-content:center;">
            <button class="btn" id="m5record">📝 记录数据</button>
            <button class="btn-secondary" id="m5cleartable">🗑 清空表格</button>
          </div>
          <table class="data-table" id="m5table">
            <thead><tr><th>序号</th><th>长</th><th>宽</th><th>面积 = 长 × 宽</th><th>周长 = (长+宽) × 2</th></tr></thead>
            <tbody></tbody>
          </table>

          <div class="step-card" style="margin-top:24px;">
            <div class="step-title">
              <span class="step-num">🎯</span>逆向挑战
            </div>
            <div id="m5Challenge"></div>
            <div class="btn-row" style="justify-content:center;margin-top:12px;">
              <button class="btn" id="m5NewChallenge">🎲 出新题</button>
            </div>
          </div>
        </div>
      </template>

      <!-- ⑥ 小数认识 -->
      <template id="tpl-m6">
        <div class="card">
          <h2>⑥ 小数的初步认识 · 元角分</h2>
          <details class="lesson-hint">
            <summary>💡 不会做？点我看提示</summary>
            <p>1 元 = 10 角 = 100 分。往钱包里放硬币，看看一共是多少元。</p>
          </details>
          <div class="coin-row" id="m6coins"></div>
          <div class="money-display">
            <div class="money-big" id="m6total">0.00<small>元</small></div>
            <div class="money-sub" id="m6sub">还没有放硬币</div>
          </div>
          <div class="numline" id="m6numline"></div>
          <div class="btn-row" style="justify-content:center;">
            <button class="btn-secondary" id="m6clear">🔄 清空钱包</button>
          </div>
        </div>
      </template>

      <!-- ⑦ 时分秒 -->
      <template id="tpl-m7">
        <div class="card">
          <h2>⑦ 时、分、秒 · 时钟与秒表</h2>
          <details class="lesson-hint">
            <summary>💡 不会做？点我看提示</summary>
            <p>拖动分针或让秒针自动走，观察时分秒的关系。切换到秒表模式，体验正计时和倒计时。</p>
          </details>

          <div class="clock-wrap">
            <canvas id="m7canvas" width="320" height="320"></canvas>
            <div class="clock-info">

                <div class="growth-card-icon">💡</div>
                <div class="growth-card-title">

                  <small>每道题的心得</small>
                </div>

                  <small>最近 7 天的变化</small>

                  打卡树

                </div>

                <div class="growth-card-stat"><div class="num">0<small>天</small></div><div class="lbl">连续打卡</div></div>

              <div class="growth-card-cta">点击展开 ▾</div>
            </div>

              </div>

              </div>
              <div class="collapsible-bd">
                <div id="takeawayGalleryBox"></div>
              </div>
            </div>

            <div class="collapsible-section" id="growthChartSection">
              <div class="collapsible-hd">
                <span class="collapse-icon">▶</span>
                <span class="collapse-title">📈 最近 7 天成长曲线</span>

            <div class="collapsible-section" id="streakTreeSection">

                <span class="collapse-title">🌱 打卡树</span>

              <div class="collapsible-bd">
                <div class="streak-dots" id="streakTreeInline"></div>
              </div>
            </div>

            <div class="collapsible-section" id="weeklyReportSection">
              <div class="collapsible-hd">
                <span class="collapse-icon">▶</span>
                <span class="collapse-title">📊 本周学习周报</span>
              </div>
              <div class="collapsible-bd">
                <div id="weeklyReportBox"></div>
              </div>
            </div>
          </div>
