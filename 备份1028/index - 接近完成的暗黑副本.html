<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>数学互动课堂</title>

<!-- ============ 1. 依赖 ============ -->
<script src="./js/localforage.min.js"></script>
<script src="./data/problems.js"></script>
<script src="./js/cloudbase.full.js"></script>
<script type="module" src="./app/main.js"></script>

<!-- ============ 2. PWA ============ -->
<meta name="theme-color" content="#29CC57">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/icon-192.png">

<style>
/* ============================================================
   0. 变量 & 基础重置
   ============================================================ */
:root {
  --primary: #29CC57;
  --primary-d: #1fa846;
  --primary-soft: #e6f9ed;
  --secondary: #3860be;
  --secondary-soft: #e8edf8;
  --bg: #f7f6f3;
  --card: #ffffff;
  --text: #141414;
  --text-soft: #2c2c2c;
  --muted: #6c6c6c;
  --border: #e4e4e4;
  --border-soft: #efefef;
  --green-soft: #e6f9ed;
  --green-text: #15803d;
  --red-soft: #fef0ef;
  --red-text: #b91c1c;
  --amber-soft: #fff8e6;
  --amber-text: #92400e;
  --r-card: 20px;
  --r-pill: 999px;
  --r-sm: 12px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,.05);
  --input-bg: #ffffff;
}

/* 智能深色模式（全面高对比度） */
[data-theme="dark"] {
  --primary: #34d399; 
  --primary-d: #10b981;
  --primary-soft: #064e3b;
  --secondary: #60a5fa;
  --secondary-soft: #1e3a8a;

  --bg: #0f1115;
  --card: #1a1d24;
  --text: #f8fafc;
  --text-soft: #cbd5e1;
  --muted: #94a3b8;
  --border: #334155;
  --border-soft: #1e293b;

  --green-soft: #064e3b;
  --green-text: #6ee7b7;
  --red-soft: #450a0a;
  --red-text: #fca5a5;
  --amber-soft: #451a03;
  --amber-text: #fcd34d;
  
  --input-bg: #0f1115;
  /* 深色模式下取消黑边框感，改用微弱的泛白边缘 */
  --shadow-sm: 0 0 0 1px rgba(255, 255, 255, 0.05);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: 300px; }
html, body { min-height: 100%; overflow-x: hidden !important; overscroll-behavior-y: auto; }
body {
  font-family: "DM Sans", "Inter", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text-soft);
  padding-bottom: 60px;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .3s, color .3s;
}

/* ⭐ 彻底修复表单控件在深色模式下的样式 */
button, input, select, textarea {
  font-family: inherit;
  font-variant-numeric: tabular-nums;
  caret-color: var(--primary);
  color: var(--text) !important;
}
input, select, textarea {
  font-size: 16px;
  -webkit-appearance: none;
  appearance: none;
  background-color: var(--input-bg) !important;
  border: 1.5px solid var(--border) !important;
  border-radius: var(--r-sm);
  padding: 10px 14px;
  outline: none;
  transition: border-color .15s, background-color .15s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary) !important;
  box-shadow: 0 0 0 3px var(--primary-soft) !important;
}
input::placeholder, textarea::placeholder {
  color: var(--muted) !important;
  opacity: 0.7;
}
select {
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236c6c6c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
  background-repeat: no-repeat !important;
  background-position: right 12px center !important;
  background-size: 16px !important;
  padding-right: 40px !important;
  cursor: pointer;
}
[data-theme="dark"] select {
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }

button { cursor: pointer; border: none; background: none; transition: all .15s; }
button:active:not(:disabled) { transform: scale(.97); }
button:disabled { opacity: .5; cursor: not-allowed; }

/* ============================================================
   1. App Shell：页面容器 & 路由
   ============================================================ */
.app-header { text-align: center; padding: 32px 16px 20px; position: relative; z-index: 10; }
.app-header.hidden { display: none !important; }
.app-header h1 { font-family: "DM Serif Display", "Playfair Display", "PingFang SC", serif; font-size: 28px; font-weight: 500; color: var(--text); letter-spacing: -0.02em; }
.app-header p { margin-top: 8px; font-size: 14px; color: var(--muted); letter-spacing: 2px; }

.page { display: none !important; min-height: calc(100vh - 60px); padding-bottom: 100px; }
.page.active { display: block !important; animation: pageIn .28s cubic-bezier(.34,1.3,.64,1); }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
#page-lesson { display: none; }
#page-lesson.active { display: flex; flex-direction: column; min-height: 100vh; }

/* ============================================================
   2. 通用组件
   ============================================================ */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  width: 100%; box-sizing: border-box;
  animation: cardIn .35s cubic-bezier(.34,1.2,.64,1);
  position: relative;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.card h2 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 6px; letter-spacing: -0.02em; }
.card .sub { font-size: 13.5px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }

.btn {
  padding: 12px 24px; border-radius: var(--r-pill);
  background: var(--primary); color: #fff !important;
  font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-secondary {
  padding: 12px 24px; border: 1.5px solid var(--border); border-radius: var(--r-pill);
  background: var(--card); color: var(--text-soft); font-size: 15px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-secondary:hover { border-color: var(--primary); color: var(--primary-d); background: var(--primary-soft); }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }

.feedback {
  margin-top: 16px; padding: 12px 18px; border-radius: var(--r-sm);
  font-size: 15px; font-weight: 600; text-align: center;
}
.feedback.ok { background: var(--green-soft); color: var(--green-text); }
.feedback.error { background: var(--red-soft); color: var(--red-text); }

.controls { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
.controls label { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--text-soft); }
.controls input[type=range] { width: 150px; accent-color: var(--primary); border: none; padding: 0; background: transparent; box-shadow: none; }
.controls .val {
  display: inline-block; min-width: 32px; text-align: center;
  background: var(--primary); color: #fff !important; border-radius: 6px; padding: 2px 6px; font-size: 13px;
}

/* ============================================================
   3. 弹窗基类
   ============================================================ */
.student-modal-mask, .pwd-modal-mask, .explain-modal-mask,
.export-modal-mask, .share-card-mask, .grade-modal-mask {
  position: fixed; inset: 0; background: rgba(0, 0, 0, .6);
  display: flex; align-items: center; justify-content: center;
  z-index: 10001; padding: 20px; animation: fadeIn .18s;
}
.student-modal, .pwd-modal, .grade-modal, .export-modal, .share-card {
  background: var(--card); border-radius: var(--r-card); padding: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
  width: 340px; max-width: 90vw; text-align: center;
  color: var(--text);
}
.explain-modal { background: var(--card); border-radius: var(--r-card); width: 640px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column; }
.explain-modal-close, .wrong-book-close {
  width: 44px; height: 44px; border-radius: var(--r-sm); background: var(--border-soft); color: var(--muted); font-size: 20px; display: flex; align-items: center; justify-content: center;
}
.explain-modal-close:hover, .wrong-book-close:hover { background: var(--border); color: var(--text); }

/* ============================================================
   4. 首页（Home） - 修复周进度
   ============================================================ */
.home-wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
.home-hero {
  width: 100%; text-align: left; padding: 28px 26px; margin-bottom: 24px;
  background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r-card);
  color: var(--text); box-shadow: var(--shadow-sm); display: block;
}
.home-hero-kicker { color: var(--primary); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.home-hero-title { font-size: 24px; font-weight: 700; margin: 8px 0; letter-spacing: -0.02em; }
.home-hero-meta { color: var(--muted); font-size: 13.5px; }
.home-hero-cta { display: inline-block; margin-top: 16px; padding: 10px 22px; background: var(--primary); color: #fff !important; border-radius: var(--r-pill); font-size: 14px; font-weight: 600; }

.home-section-title { font-size: 16px; font-weight: 800; color: var(--text); margin: 8px 4px 12px; letter-spacing: -0.01em; }

.island-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
.island {
  text-align: left; border: 1px solid var(--border); background: var(--card);
  border-radius: var(--r-card); padding: 18px 16px; cursor: pointer;
  transition: border-color .15s, box-shadow .15s, transform .15s; box-shadow: var(--shadow-sm);
}
.island:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--primary); }
.island-icon { font-size: 28px; line-height: 1; margin-bottom: 8px; }
.island-name { font-size: 15px; font-weight: 650; color: var(--text); }
.island-desc { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
.island-progress { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
.island-progress span { display: block; height: 100%; background: var(--primary); border-radius: 2px; transition: width .6s cubic-bezier(.34,1.3,.64,1); }
.island-meta { font-size: 11.5px; color: var(--muted); font-weight: 600; }

/* ============================================================
   4. 首页（Home） - 今日任务与进度修复
   ============================================================ */

/* 容器：修复横向撑满与内边距 */
.home-tasks, .home-mastered, .home-week {
  background: var(--card); 
  border: 1px solid var(--border); 
  border-radius: var(--r-card); 
  box-shadow: var(--shadow-sm); 
  margin-bottom: 20px; 
  padding: 18px;
  width: 100%; /* 确保容器撑满 */
}

.home-tasks-hd, .home-mastered-hd, .home-week-hd {
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  font-size: 15px; 
  font-weight: 800; 
  color: var(--text); 
  margin-bottom: 12px;
}

/* 任务列表 */
.home-tasks-list { 
  display: flex; 
  flex-direction: column; 
  gap: 10px; /* 增加项之间的间距 */
  width: 100%; 
}

/* 单个任务卡片：修复宽度塌陷与对齐 */
.home-task {
  width: 100%; /* 核心修复：强制撑满父容器 */
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  cursor: pointer;
  text-align: left;
  transition: all .15s;
}

.home-task:hover {
  border-color: var(--primary);
  background: var(--card);
}

.home-task.done {
  border-color: var(--primary-soft);
  background: var(--primary-soft);
}

/* 左侧图标：不收缩 */
.home-task-icon {
  flex-shrink: 0;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 中间文本：占据剩余全部空间 */
.home-task-body {
  flex: 1; /* 核心修复：让文字区撑满，把箭头推到最右边 */
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.home-task-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--text);
}

.home-task.done .home-task-title {
  color: var(--green-text);
}

.home-task-desc {
  font-size: 12px;
  color: var(--muted);
}

/* 进度条 */
.home-task-progress {
  height: 4px;
  background: var(--border-soft);
  border-radius: 2px;
  overflow: hidden;
  width: 100%;
  margin-top: 4px;
}

.home-task-progress span {
  display: block;
  height: 100%;
  background: var(--primary);
  border-radius: 2px;
  transition: width .4s ease;
}

.home-task.done .home-task-progress span {
  background: var(--green-text);
}

/* 右侧箭头/勾号 */
.home-task-arrow {
  flex-shrink: 0;
  font-size: 18px;
  color: var(--muted);
  font-weight: 700;
}

.home-task.done .home-task-arrow {
  color: var(--green-text);
}
.home-mastered-item { background: var(--bg); padding: 8px 12px; border-radius: var(--r-sm); color: var(--text-soft); margin-bottom: 6px; }

/* ⭐ 修复首页周进度布局与视觉 */
.home-week-count b { color: var(--text); font-size: 16px; font-family: ui-monospace, monospace; }
.home-week-days { display: flex; gap: 8px; margin-bottom: 12px; width: 100%; justify-content: space-between; }
.home-week-day { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.home-week-dot { width: 32px; height: 32px; margin-bottom: 6px; border-radius: 50%; background: var(--bg); color: var(--muted); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.home-week-day.active .home-week-dot { background: var(--primary); color: #fff !important; }
.home-week-label { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.home-week-day.today .home-week-label { color: var(--text); font-weight: 800; }
.home-week-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; width: 100%; }
.home-week-bar span { display: block; height: 100%; background: var(--primary); border-radius: 2px; transition: width .6s ease; }
.home-week-entry { border: none; background: transparent; color: var(--primary-d); font-size: 12.5px; font-weight: 700; cursor: pointer; align-self: flex-end; }

/* ============================================================
   ⭐ 追加：首页本周进度 & 错题推荐卡片 视觉修复
   ============================================================ */

/* 1. 本周进度：同一行展示，均匀分布 */
.home-week-hd {
  display: flex;
  flex-direction: row; /* 强制横向排列 */
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap; /* 防止小屏挤爆 */
  margin-bottom: 14px;
  gap: 8px;
}

.home-week-hd > span:first-child {
  font-size: 15px;
  font-weight: 800;
  color: var(--text);
}

.home-week-count {
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
  margin-left: auto; /* 把数字挤到右边 */
}

.home-week-count b {
  color: var(--text);
  font-size: 16px;
  font-family: ui-monospace, monospace;
}

.home-week-entry {
  border: none;
  background: transparent;
  color: var(--primary-d);
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  padding: 0 0 0 8px;
}

/* 2. 错题推荐卡片：恢复明亮的黄色背景 */
.home-recommend {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  padding: 18px;
  /* 恢复淡黄色背景和黄色边框 */
  background: #fffbeb; 
  border: 1.5px solid #fcd34d;
  border-radius: var(--r-card);
  box-shadow: var(--shadow-sm);
  margin-bottom: 20px;
}

/* 深色模式下稍微暗一点的黄，保证不刺眼但依然有辨识度 */
[data-theme="dark"] .home-recommend {
  background: rgba(245, 158, 11, 0.15);
  border-color: #f59e0b;
}

.home-recommend-icon {
  flex-shrink: 0;
  font-size: 28px;
}

.home-recommend-body {
  flex: 1;
  font-size: 13.5px;
  color: #92400e; /* 文字用深黄色 */
  font-weight: 600;
  line-height: 1.6;
}

[data-theme="dark"] .home-recommend-body {
  color: #fcd34d; /* 深色模式文字用亮黄色 */
}

.home-recommend-body b {
  color: #b45309; /* 数字加粗，强调色 */
  font-weight: 800;
}

[data-theme="dark"] .home-recommend-body b {
  color: #fbbf24;
}

.home-recommend-cta {
  flex-shrink: 0;
  padding: 8px 20px;
  background: #f59e0b; /* 按钮用亮黄色 */
  color: #fff !important;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: transform .15s;
}

.home-recommend-cta:active {
  transform: scale(.95);
}

/* 适配移动端，防止按钮把文字挤没 */
@media (max-width: 600px) {
  .home-recommend {
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }
  .home-recommend-cta {
    width: 100%;
  }
}
.home-growth-entry, .home-messages-entry, .home-settings-entry {
  width: 100%; margin-top: 12px; padding: 14px; border-radius: var(--r-card); font-size: 14px; font-weight: 700; cursor: pointer; transition: all .18s;
  border: 1.5px solid var(--border); background: var(--card); color: var(--text-soft);
}
.home-growth-entry:hover, .home-messages-entry:hover, .home-settings-entry:hover { border-color: var(--primary); color: var(--primary-d); background: var(--primary-soft); }

/* ============================================================
   5. 课页壳 & 顶部控制条
   ============================================================ */
.lesson-header { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 12px; padding: max(10px, env(safe-area-inset-top)) 16px 10px; background: var(--bg); border-bottom: 1px solid var(--border); }
.lesson-back, .lesson-more { width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--card); border: 1px solid var(--border); color: var(--text-soft); font-size: 18px; display: flex; align-items: center; justify-content: center; }
.lesson-title { flex: 1; font-size: 16px; font-weight: 800; color: var(--text); }

.lesson-progress { max-width: 1200px; margin: 0 auto; padding: 10px 16px 14px; font-size: 13px; color: var(--muted); font-weight: 600; position: relative; }
.lesson-progress-bar { position: absolute; left: 16px; right: 16px; bottom: 4px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.lesson-progress-bar span { display: block; height: 100%; background: var(--primary); transition: width .45s ease; }

.lesson-levels { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; max-width: 1200px; margin: 0 auto; scrollbar-width: none; }
.lesson-levels::-webkit-scrollbar { display: none; }
.lesson-levels.is-hidden { display: none !important; }
.level-btn { padding: 8px 14px; border: 1.5px solid var(--border); border-radius: var(--r-pill); background: var(--card); color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.level-btn.current { background: var(--primary); border-color: var(--primary); color: #fff !important; }
.level-btn.done { background: var(--green-soft); border-color: var(--primary); color: var(--primary-d); }

.lesson-stage { max-width: 1200px; margin: 0 auto; padding: 16px; }
.lesson-hint { margin-bottom: 16px; border: 1.5px dashed var(--border); border-radius: var(--r-sm); padding: 10px 14px; background: var(--card); }
.lesson-hint summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); }
.lesson-hint p { font-size: 13px; color: var(--text-soft); line-height: 1.7; margin-top: 8px; }

.problem-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px dashed var(--border); }
.problem-bar select, .problem-bar input[type="text"] { flex: 1 1 140px; height: 44px; border-radius: var(--r-pill); padding: 0 16px; }
.problem-bar select { min-width: 200px; flex: 2 1 200px; }
.problem-bar .btn, .problem-bar .btn-secondary, .problem-bar .file-btn { flex-shrink: 0; height: 44px; padding: 0 20px; border-radius: var(--r-pill); display: inline-flex; align-items: center; justify-content: center; }
.problem-bar .file-btn { border: 1.5px solid var(--border); background: var(--card); color: var(--text-soft); cursor: pointer; font-size: 14px; font-weight: 600; }
.problem-bar .file-btn:hover { border-color: var(--primary); color: var(--primary-d); }

/* ============================================================
   6. 模块专属样式
   ============================================================ */
/* --- M1 混合运算 --- */
.expr-box { background: var(--bg); border: 1.5px dashed var(--border); border-radius: var(--r-card); padding: 24px 12px; min-height: 110px; display: flex; align-items: center; justify-content: center; }
.expr { display: flex; gap: 12px 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.token { display: inline-flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; min-width: 50px; height: 58px; border-radius: var(--r-sm); padding: 0 10px; }
.token.num { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.token.op { background: var(--primary); color: #fff !important; cursor: pointer; }
.token.paren { background: transparent; color: var(--primary-d); font-size: 36px; box-shadow: none; }
.steps-box { margin-top: 14px; padding: 16px 22px; background: var(--bg); border-radius: var(--r-sm); border: 1px solid var(--border); font-family: monospace; font-size: 20px; line-height: 1.9; color: var(--text); }
.steps-empty { color: var(--muted); font-size: 14px; text-align: center; font-style: italic; }
.step-row { display: flex; align-items: center; gap: 12px; padding: 3px 0; }
.step-eq { color: var(--muted); font-weight: 700; min-width: 42px; text-align: right; }
.step-tag { font-size: 12px; padding: 2px 10px; border-radius: 6px; background: var(--amber-soft); color: var(--amber-text); }
.step-part { background: var(--amber-soft); color: var(--amber-text); padding: 1px 8px; border-radius: 6px; border: 1px dashed var(--amber-text); font-weight: 800; }
.step-final { color: var(--green-text); font-weight: 800; font-size: 24px; background: var(--green-soft); padding: 4px 16px; border-radius: 8px; display: inline-block; }
#m1Input, .step-input { width: 100px; padding: 10px; font-size: 22px; font-weight: 800; text-align: center; }
#m1Input.correct, .step-input.correct { border-color: var(--primary); background: var(--green-soft); color: var(--green-text); }
#m1Input.wrong, .step-input.wrong { border-color: var(--red-text); background: var(--red-soft); color: var(--red-text); }

.priority-box { background: var(--card); padding: 16px; border: 1.5px solid var(--primary); border-radius: var(--r-card); margin-bottom: 16px; }
.priority-label { font-size: 14px; font-weight: 800; color: var(--primary-d); margin-bottom: 10px; }
.priority-options { display: flex; gap: 10px; flex-wrap: wrap; }
.priority-opt { padding: 8px 20px; border: 1.5px solid var(--border); border-radius: var(--r-pill); background: var(--card); color: var(--text-soft); font-size: 15px; font-weight: 700; }
.priority-opt:hover { border-color: var(--primary); color: var(--primary-d); }
.priority-opt.chosen { background: var(--primary); color: #fff !important; border-color: var(--primary); }

/* --- M2 铺地砖 --- */
#m2canvas { width: 100%; max-width: 720px; display: block; margin: 0 auto; border-radius: var(--r-sm); }
.calc-display { margin-top: 16px; padding: 16px; border-radius: var(--r-sm); background: var(--bg); border: 1px solid var(--border); text-align: center; min-height: 60px; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; }
.calc-hint { font-size: 15px; color: var(--muted); }
.calc-hint b { color: var(--text); font-size: 18px; }
.calc-final { font-size: 24px; font-weight: 800; color: var(--text); }
.tag { padding: 5px 14px; border-radius: 8px; font-size: 15px; font-weight: 700; }
.tag.blue { background: var(--secondary-soft); color: var(--secondary); }
.tag.amber { background: var(--amber-soft); color: var(--amber-text); }

/* --- M3 分数 --- */
.frac-wrap { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; align-items: center; }
#m3canvas { width: 340px; height: 340px; max-width: 100%; cursor: pointer; border-radius: 50%; }
.frac-info { text-align: center; min-width: 200px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; font-size: 44px; font-weight: 800; line-height: 1; color: var(--text); margin-bottom: 14px; }
.frac .line { width: 100%; min-width: 60px; height: 3px; background: var(--text); margin: 8px 0; border-radius: 2px; }
.frac-text { font-size: 17px; font-weight: 700; color: var(--text-soft); }
.frac-extra { margin-top: 24px; padding: 20px; background: var(--bg); border-radius: var(--r-card); border: 1px solid var(--border); }
.frac-extra-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; justify-content: center; }
.frac-tab { padding: 8px 18px; border: 1.5px solid var(--border); border-radius: var(--r-pill); background: var(--card); color: var(--muted); font-size: 13.5px; font-weight: 700; }
.frac-tab.active { background: var(--primary); color: #fff !important; border-color: var(--primary); }
/* 修复内容区深色背景 */
.frac-extra-content { padding: 16px; background: var(--card); border-radius: var(--r-sm); border: 1px solid var(--border); min-height: 120px; }
.frac-extra-content * { color: var(--text-soft); }
.frac-cmp-btn { width: 56px; height: 56px; border: 1.5px solid var(--border); border-radius: var(--r-sm); background: var(--card); color: var(--text-soft); font-size: 24px; font-weight: 800; }
.frac-cmp-btn:hover { border-color: var(--primary); }
.frac-cmp-btn.correct { background: var(--primary); color: #fff !important; border-color: var(--primary); }
.frac-cmp-btn.wrong { background: var(--red-text); color: #fff !important; border-color: var(--red-text); }
.frac-calc-input { width: 70px; padding: 10px; font-size: 20px; font-weight: 800; text-align: center; }
.equiv-bar { display: flex; width: 240px; height: 44px; border: 1.5px solid var(--border); border-radius: var(--r-sm); overflow: hidden; margin-bottom: 10px; background: var(--bg); }
.equiv-seg { flex: 1; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--border); color: transparent; }
.equiv-seg:last-child { border-right: none; }
.equiv-seg.filled { background: var(--primary); color: #fff !important; }
.equiv-label { font-size: 18px; font-weight: 800; color: var(--text); }

/* --- M4 长度 --- */
.ladder { display: flex; flex-direction: column; align-items: center; margin: 10px 0 24px; }
.rung { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 340px; padding: 12px 20px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.arrow-row { font-size: 13px; color: var(--primary-d); font-weight: 700; padding: 5px 0; }
.converter { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: center; padding: 20px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); }
.result-list { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.result-item { padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 15px; display: flex; justify-content: space-between; align-items: center; color: var(--text-soft); }
.result-item.hl { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-d); }
.quiz-box { margin-top: 22px; padding: 20px; border-radius: var(--r-card); background: var(--bg); border: 1.5px dashed var(--border); text-align: center; }
.quiz-q { font-size: 19px; font-weight: 700; margin-bottom: 14px; color: var(--text); }
.quiz-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
.quiz-row input { width: 130px; text-align: center; }

/* --- M5 面积 --- */
.grid { display: grid; grid-template-columns: repeat(10, 32px); gap: 2px; width: max-content; margin: 0 auto; }
.cell { width: 32px; height: 32px; border-radius: 5px; background: var(--border-soft); }
.cell.on { background: var(--primary-soft); }
.cell.edge { background: var(--primary); }
.stats { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.stat { flex: 1; min-width: 140px; padding: 16px; border-radius: var(--r-sm); text-align: center; background: var(--bg); border: 1px solid var(--border); }
.stat .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.stat .value { font-size: 26px; font-weight: 800; color: var(--text); }
table.data-table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 14px; }
table.data-table th, table.data-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: center; color: var(--text-soft); }
table.data-table th { background: var(--bg); font-size: 13px; color: var(--muted); font-weight: 700; }

/* 修复 M5 逆向挑战区域 */
#m5Challenge { background: var(--bg) !important; border: 1.5px dashed var(--border) !important; border-radius: var(--r-sm) !important; padding: 16px !important; }
.m5-chal-question { font-size: 16px; font-weight: 700; color: var(--text) !important; line-height: 1.8; margin-bottom: 16px; text-align: center; }
.m5-chal-input-row { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
.m5-chal-input { width: 80px; text-align: center; font-size: 18px; font-weight: 800; }
.m5-chal-opt { padding: 12px 24px; border: 1.5px solid var(--border); border-radius: var(--r-sm); background: var(--card); color: var(--text-soft); font-size: 18px; font-weight: 800; }
.m5-chal-opt.correct { background: var(--primary); border-color: var(--primary); color: #fff !important; }
.m5-chal-fb { text-align: center; font-size: 14px; font-weight: 700; margin-top: 8px; }

/* --- M6 小数 --- */
.coin { width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; color: #fff; box-shadow: inset 0 -4px 0 rgba(0,0,0,.1); }
.coin.yuan { background: linear-gradient(145deg, #fbbf24, #d97706); }
.coin.jiao { background: linear-gradient(145deg, #94a3b8, #64748b); }
.coin.fen { background: linear-gradient(145deg, #c084fc, #7c3aed); }
.money-display { text-align: center; padding: 24px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-card); margin-bottom: 18px; }
.money-big { font-size: 42px; font-weight: 800; color: var(--text); }
.money-sub { font-size: 15px; color: var(--muted); margin-top: 10px; }
.numline { position: relative; height: 70px; margin: 30px 10px 10px; border-bottom: 3px solid var(--border); }
.nl-tick { position: absolute; bottom: 0; width: 1.5px; height: 9px; background: var(--border); }
.nl-tick.major { height: 18px; width: 2px; background: var(--muted); }
.nl-label { position: absolute; bottom: -26px; font-size: 12px; color: var(--muted); font-weight: 600; }
.nl-marker { position: absolute; bottom: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 16px solid var(--primary-d); }

/* --- M7 时间 --- */
.clock-digital { font-size: 48px; font-weight: 800; color: var(--text); font-family: monospace; letter-spacing: 2px; }
.clock-chinese { font-size: 18px; font-weight: 700; color: var(--text-soft); margin: 10px 0 18px; }
.stopwatch-panel { margin-top: 24px; padding: 20px; background: var(--bg); border-radius: var(--r-card); border: 1px solid var(--border); }
.sw-tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; }
.sw-tab { padding: 9px 18px; border: 1.5px solid var(--border); border-radius: var(--r-pill); background: var(--card); color: var(--muted); font-size: 14px; font-weight: 700; }
.sw-tab.active { background: var(--primary); color: #fff !important; border-color: var(--primary); }
.sw-display { text-align: center; font-size: 56px; font-weight: 800; font-family: monospace; color: var(--text); padding: 16px; background: var(--card); border-radius: var(--r-sm); margin-bottom: 16px; border: 1px solid var(--border); }
.sw-display.warn { color: var(--amber-text); }
.sw-display.danger { color: var(--red-text); }

/* 修复 M7 时间推算区 */
#m7CalcChallenge { background: var(--bg) !important; border: 1.5px dashed var(--border) !important; border-radius: var(--r-sm) !important; padding: 16px !important; }
.m7-calc-question { text-align: center; font-size: 16px; font-weight: 700; color: var(--text) !important; line-height: 1.9; margin-bottom: 16px; }
.m7-calc-input-row { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
.m7-calc-input { width: 70px; text-align: center; font-size: 20px; font-weight: 800; }
.m7-calc-fb { text-align: center; font-size: 14px; font-weight: 700; margin-top: 8px; }

/* --- M8 倍数 --- */
.bei-wrap { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; margin: 20px auto; max-width: 600px; padding: 20px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); }
.bei-label { font-size: 15px; font-weight: 700; color: var(--text-soft); min-width: 90px; }
.bei-shape { font-size: 30px; }
.bei-group { display: inline-flex; align-items: center; gap: 4px; padding: 8px 12px; border: 1.5px dashed var(--primary); border-radius: var(--r-sm); background: var(--primary-soft); }
.div-row { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; font-family: monospace; padding: 10px 22px; border-radius: var(--r-sm); }
.div-row.mul { background: var(--amber-soft); color: var(--amber-text); }
.div-row.div { background: var(--secondary-soft); color: var(--secondary); }

/* --- M9 竖式 --- */
.vertical-calc { display: flex; flex-direction: column; align-items: center; font-family: monospace; color: var(--text); }
.vc-row { display: flex; gap: 4px; padding: 2px 0; }
.vc-cell { width: 48px; height: 54px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 34px; font-weight: 700; }
.vc-cell.highlight { background: var(--primary-soft); color: var(--primary-d); }
.vc-cell.carry { color: var(--red-text); font-size: 22px; font-weight: 800; height: 30px; }
.vc-cell.op { color: var(--text); font-size: 32px; }
.vc-line { width: 100%; height: 2.5px; background: var(--text); margin: 4px 0 6px; }
.vc-div-grid { display: grid; grid-template-columns: 40px 24px 48px 48px 48px; grid-auto-rows: 50px; justify-content: center; font-family: monospace; }
.vc-div-grid > div { display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; color: var(--text); }
.vc-div-grid .vc-div-sep { border-left: 2.5px solid var(--text); border-top: 2.5px solid var(--text); border-top-left-radius: 0; border-top-right-radius: 12px; }
.vc-div-grid .vc-div-line { border-bottom: 2.5px solid var(--text); height: 0; align-self: center; }
/* 针对 M9 的运算符选择器 */
#m9op { background-color: var(--card) !important; color: var(--text) !important; border-color: var(--border) !important; }

/* --- M10 日历 --- */
.calendar { width: 100%; max-width: 440px; margin: 20px auto; border-collapse: separate; border-spacing: 4px; }
.calendar th { padding: 10px; font-size: 13px; color: var(--muted); font-weight: 700; background: var(--bg); border-radius: 8px; }
.calendar td { padding: 12px; text-align: center; font-size: 15px; font-weight: 700; border-radius: 8px; background: var(--bg); color: var(--text-soft); }
.calendar td.weekend { color: var(--red-text); }

/* --- M11 坐标 --- */
.coord-grid { display: grid; gap: 4px; justify-content: center; margin: 20px auto; width: max-content; }
.coord-cell { width: 52px; height: 52px; border-radius: var(--r-sm); background: var(--bg); color: var(--text); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
.coord-cell:hover { border-color: var(--primary); }
.coord-cell.selected { background: var(--primary); color: #fff !important; border-color: var(--primary); }
.coord-axis { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--muted); }

/* --- M13 解题思维 --- */
.problem-bar-current { flex: 1 1 100%; margin-bottom: 8px; }
#problem-text { min-height: 60px; max-height: 30vh; overflow-y: auto; border: 1.5px solid var(--border); border-radius: var(--r-sm); font-size: 15px; line-height: 1.7; background: var(--input-bg); color: var(--text); padding: 12px 16px; }
#problem-text:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
.problem-bar-change { display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--border); background: var(--card); color: var(--text-soft); padding: 8px 14px; border-radius: var(--r-pill); font-size: 13px; font-weight: 700; }
.problem-bar-change:hover { border-color: var(--primary); color: var(--primary-d); }
.m13-step { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r-card); margin-bottom: 12px; overflow: hidden; }
.m13-step.completed { border-color: var(--primary); background: var(--green-soft); }
.m13-step-hd { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: var(--bg); cursor: pointer; font-size: 15px; font-weight: 800; color: var(--text); }
.m13-step.completed .m13-step-hd { background: transparent; color: var(--primary-d); }
.m13-step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.m13-step.completed .m13-step-num { background: var(--primary); color: #fff !important; }
.m13-step-bd { padding: 16px 14px; border-top: 1px dashed var(--border); }
/* 高亮工具栏 */
.hl-toolbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px; background: var(--card); border-radius: var(--r-sm); border: 1.5px solid var(--border); margin-bottom: 12px; }
.hl-btn { padding: 6px 14px; border: 1.5px solid transparent; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--text-soft); }
/* 草稿纸 */
.scratch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.scratch-cell textarea { width: 100%; height: 150px; padding: 18px 14px 12px; font-family: monospace; font-size: 14px; line-height: 26px; background-color: var(--input-bg); background-image: linear-gradient(var(--border-soft) 1px, transparent 1px); background-size: 100% 26px; background-position: 0 12px; resize: vertical; border: 1.5px solid var(--border); border-radius: var(--r-sm); color: var(--text); }
.formula-step { background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--r-sm); padding: 16px 18px; margin-bottom: 12px; }
.formula-line { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.formula-line label { font-size: 14px; font-weight: 700; color: var(--text-soft); min-width: 70px; flex-shrink: 0; }
.formula-line input { flex: 1; min-width: 0; }
.check-area { padding: 16px; background: var(--bg); border: 1.5px dashed var(--border); border-radius: var(--r-sm); margin-bottom: 12px; }
.check-area label { font-size: 14px; font-weight: 800; color: var(--text); display: block; margin-bottom: 8px; }
.check-area input { width: 100%; font-size: 17px; font-weight: 700; }
.takeaway { padding: 16px 18px; background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--r-sm); }
.takeaway h4 { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 10px; }
.takeaway-row { display: flex; gap: 8px; }
.takeaway-row input { flex: 1; min-width: 0; }
.m13-check-btn { padding: 14px 24px; border-radius: var(--r-pill); background: var(--primary); color: #fff !important; font-size: 16px; font-weight: 800; }
.m13-result-badge { font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: var(--r-sm); }
.m13-result-badge.ok { background: var(--green-soft); color: var(--green-text); }
.m13-result-badge.no { background: var(--red-soft); color: var(--red-text); }

/* ============================================================
   ⭐ M14 我的成长页面 完整排版与深色模式修复
   ============================================================ */

/* 1. 修复顶部提示横幅（解决浅蓝背景过亮） */
.growth-weekly-tip {
  margin: 12px 16px;
  padding: 12px 16px;
  background: #f0f9ff;
  border: 2px solid #bae6fd;
  border-radius: var(--r-sm);
  font-size: 13px;
  color: #0c4a6e;

}

}

.weekly-summary {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-card);

}

/* ============================================================
   ⭐ M14 成长周报：完美布局还原 & 深色模式自适应
   ============================================================ */

/* 1. 外层卡片：紫色/深色渐变背景 */
.weekly-summary {
  background: linear-gradient(135deg, #f5f3ff, #ede9fe); /* 浅色模式原版紫色 */
  border: 2px solid #c4b5fd;
  border-radius: var(--r-card);
  padding: 18px 20px;
  margin-bottom: 20px;
}
[data-theme="dark"] .weekly-summary {
  background: linear-gradient(135deg, #1e1b4b, #2e1065); /* 深色模式深紫 */
  border-color: #4c1d95;
}

/* 2. 头部时间 */
.weekly-summary-hd {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
  font-weight: 800;
  color: #5b21b6; /* 浅色深紫 */
  margin-bottom: 16px;
}
[data-theme="dark"] .weekly-summary-hd { color: #c4b5fd; }
.weekly-summary-range {
  font-size: 12px;
  color: #7c3aed;
  font-weight: 600;
}
[data-theme="dark"] .weekly-summary-range { color: #8b5cf6; }

/* 3. 核心：顶部 5 个统计卡片（完美网格） */
.weekly-summary-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); /* 自动均分 */
  gap: 12px;
  margin-bottom: 24px;
}
.weekly-stat {
  background: #ffffff;
  border-radius: var(--r-sm);
  padding: 16px 10px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.02);
}
[data-theme="dark"] .weekly-stat { background: var(--card); }

.weekly-stat-value {
  font-size: 26px;
  font-weight: 800;
  font-family: ui-monospace, monospace;
  color: #7c3aed; /* 原版紫色数字 */
  margin-bottom: 4px;
}
[data-theme="dark"] .weekly-stat-value { color: var(--primary); }
.weekly-stat-label {
  font-size: 12px;
  color: #64748b;
  font-weight: 600;
}

/* 4. 本周练得最多（标签） */
.weekly-summary-section { margin-bottom: 20px; }
.weekly-summary-section-title {
  font-size: 13px;
  font-weight: 800;
  color: #6d28d9;
  margin-bottom: 10px;
}
[data-theme="dark"] .weekly-summary-section-title { color: #a78bfa; }
.weekly-summary-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.weekly-summary-tag {
  background: #ffffff;
  border: 1.5px solid #ddd6fe;
  padding: 6px 14px;
  border-radius: var(--r-pill);
  font-size: 12.5px;
  font-weight: 700;
  color: #5b21b6;
}
[data-theme="dark"] .weekly-summary-tag {
  background: rgba(255,255,255,0.05);
  border-color: rgba(255,255,255,0.1);
  color: #ddd6fe;
}

/* 5. 本周掌握的题（列表） */
.weekly-mastered-list { display: flex; flex-direction: column; gap: 8px; }
.weekly-mastered-item {
  background: #ffffff;
  padding: 10px 14px;
  border-radius: var(--r-sm);
  font-size: 13px;
  font-weight: 600;
  color: #15803d; /* 原版绿色 */
  display: flex;
  align-items: center;
  gap: 6px;
}
[data-theme="dark"] .weekly-mastered-item {
  background: var(--card);
  color: var(--green-text);
}
.weekly-mastered-more {
  text-align: center;
  font-size: 12.5px;
  color: #7c3aed;
  font-weight: 700;
  padding: 6px 0;
}
[data-theme="dark"] .weekly-mastered-more { color: #a78bfa; }

/* 6. 下周重点 */
.weekly-summary-tip {
  background: #ffffff;
  border-radius: var(--r-sm);
  padding: 12px 16px;
  font-size: 13.5px;
  color: #5b21b6;
  line-height: 1.6;
}
[data-theme="dark"] .weekly-summary-tip { background: var(--card); color: #c4b5fd; }

/* 7. 底部两个大按钮（导出 & 复习） */
.weekly-summary-actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}
.weekly-summary-actions button {
  flex: 1;
  padding: 14px;
  border-radius: var(--r-pill);
  font-size: 14px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  border: none;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
}

/* 导出周报按钮（白底紫字） */
#weeklyExportBtn {
  background: #ffffff;
  color: #6d28d9;
  border: 1.5px solid #ddd6fe;
}
[data-theme="dark"] #weeklyExportBtn {
  background: var(--card);
  border-color: var(--border);
  color: #a78bfa;
}

/* 复习错题按钮（紫底白字） */
#weeklyGoWrongBtn {
  background: #7c3aed;
  color: #ffffff !important;
}
[data-theme="dark"] #weeklyGoWrongBtn {
  background: var(--primary);
  color: #000 !important;
}

/* ============================================================
   适配移动端
   ============================================================ */
@media (max-width: 600px) {
  .weekly-summary-stats { grid-template-columns: repeat(2, 1fr); }
  .weekly-summary-actions { flex-direction: column; }
  .weekly-summary-hd { flex-direction: column; align-items: flex-start; gap: 6px; }
}

/* 8. 历史记录列表 */
.history-list { display: flex; flex-direction: column; gap: 10px; }
.history-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
.history-hd { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; cursor: pointer; background: var(--bg); }
.history-status { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff !important; }
.history-item.correct .history-status { background: var(--primary); }
.history-item.wrong .history-status { background: var(--red-text); }
.history-problem { flex: 1; font-size: 14px; font-weight: 600; color: var(--text-soft); }
.history-bd { display: none; padding: 16px; border-top: 1px dashed var(--border); }
.history-item.open .history-bd { display: block; }

/* ============================================================
   7. 全局浮层 & 拇指条 & Toast
   ============================================================ */
.thumb-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--border); box-shadow: 0 -8px 32px rgba(0,0,0,.1); transform: translateY(100%); transition: transform .28s ease; z-index: 900; display: flex; align-items: center; gap: 12px; }
.thumb-bar.show { transform: translateY(0); }
.thumb-bar.ok { border-top-color: var(--primary); }
.thumb-bar.err { border-top-color: var(--amber-text); }
.thumb-bar-body { flex: 1; font-size: 14px; font-weight: 700; color: var(--text); }
.thumb-bar.ok .thumb-bar-body { color: var(--green-text); }
.thumb-bar.err .thumb-bar-body { color: var(--amber-text); }
.thumb-bar-actions { display: flex; gap: 8px; }
.thumb-btn { padding: 10px 20px; border-radius: var(--r-pill); font-size: 14px; font-weight: 800; }
.thumb-btn.primary { background: var(--primary); color: #fff !important; }
.thumb-btn.secondary { background: var(--border-soft); color: var(--text-soft); }

.wrong-book-btn { position: fixed; bottom: max(50px, env(safe-area-inset-bottom)); right: max(24px, env(safe-area-inset-right)); width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--card); color: var(--red-text); font-size: 22px; box-shadow: var(--shadow-md); z-index: 998; display: flex; align-items: center; justify-content: center; }
.koji-btn { position: fixed; bottom: max(50px, env(safe-area-inset-bottom)); right: max(88px, calc(env(safe-area-inset-right) + 88px)); width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--card); color: #7c3aed; font-size: 22px; box-shadow: var(--shadow-md); z-index: 998; display: flex; align-items: center; justify-content: center; }
.wrong-book-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 360px; max-width: 90vw; background: var(--card); box-shadow: -8px 0 32px rgba(0, 0, 0, .15); z-index: 1000; transform: translateX(100%); transition: transform .28s ease; display: flex; flex-direction: column; }
.wrong-book-drawer.open { transform: translateX(0); }
.wrong-book-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--text); font-weight: 800; }
.m3-toast { display: flex; align-items: center; gap: 8px; position: fixed; top: max(60px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: rgba(20, 20, 20, .92); color: #fff !important; padding: 12px 20px; border-radius: var(--r-sm); font-size: 14px; font-weight: 700; z-index: 9999; }

/* ============================================================
   8. 响应式
   ============================================================ */
@media (max-width: 600px) {
  .app-header h1 { font-size: 22px; }
  .card { padding: 18px 14px 22px; }
  .home-hero { padding: 22px; }
  .island-grid { grid-template-columns: repeat(2, 1fr); }
  .island-desc { display: none; }
  .island-name { font-size: 14px; }
  .problem-bar select, .problem-bar input[type="text"] { flex: 1 1 100%; min-width: 0; }
  .problem-bar .btn, .problem-bar .btn-secondary, .problem-bar .file-btn { flex: 1; }
  .token { font-size: 26px; min-width: 44px; height: 52px; }
  .sw-display { font-size: 42px; }
  .clock-digital { font-size: 38px; }
  .vc-cell { width: 40px; height: 46px; font-size: 26px; }
  .vc-div-grid { grid-template-columns: 32px 18px repeat(3, 40px); grid-auto-rows: 44px; }
}
</style>
</head>
<body>

<div class="app-header" id="globalHeader">
  <h1 id="appTitle">🎓 数学互动课堂</h1>
  <p>动 手 操 作 · 即 时 反 馈 · 发 现 规 律</p>
</div>

<div id="page-home" class="page active"></div>

<div id="page-lesson" class="page">
  <div id="lessonHeader" class="lesson-header"></div>
  <div id="lessonProgress" class="lesson-progress"></div>
  <div id="lessonLevels" class="lesson-levels is-hidden"></div>
  <div id="modulePool" class="lesson-stage">
    <main id="lesson-stage-main">
      <!-- ========================================================
           模块模板（tpl-m1 ~ m14）
           ======================================================== -->
      <!-- ① 混合运算 -->
      <template id="tpl-m1">
        <div class="card">
          <h2>① 混合运算 · 步步为营</h2>
          <details class="lesson-hint">
            <summary>💡 不会做？点我看提示</summary>
            <p>先算乘除，后算加减。点击算式中的运算符，把它先算出来。</p>
          </details>

          <div class="problem-bar">
            <select id="m1Select"></select>
            <button class="btn" id="m1Load">📥 载入</button>
            <input type="text" id="m1Custom" placeholder="或输入算式，如：12 × 3 + 15">
            <button class="btn-secondary" id="m1UseCustom">使用</button>
            <label class="file-btn">📎 上传 txt<input type="file" id="m1Upload" accept=".txt" hidden></label>
            <button class="btn-secondary" id="m1Random">🎲 随机出题</button>
          </div>

          <div class="expr-box"><div class="expr" id="m1expr"></div></div>

          <div id="m1PriorityBox" class="priority-box" style="display:none;">
            <div class="priority-label">🤔 想一想：这道题应该先算哪一步？</div>
            <div class="priority-options" id="m1PriorityOptions"></div>
            <div id="m1PriorityFeedback" class="priority-feedback"></div>
          </div>

          <div class="steps-box" id="m1steps"></div>
          <div class="feedback" id="m1fb">点击算式中的运算符，把它先算出来 👆</div>
          <div class="btn-row">
            <button class="btn-secondary" id="m1reset">🔄 重来一次</button>
          </div>
        </div>
      </template>

      <!-- ② 乘法面积 -->
      <template id="tpl-m2">
        <div class="card">
          <h2>② 多位数乘一位数 · 铺地砖</h2>
          <details class="lesson-hint">
            <summary>💡 不会做？点我看提示</summary>
            <p>一块一块地铺满地面，看看 12 × 3 到底是怎么算出来的。</p>
          </details>
          <div class="controls">
            <label>每行 <input type="range" id="m2a" min="11" max="25" value="12"> <span class="val" id="m2aval">12</span> 块</label>
            <label>共 <input type="range" id="m2b" min="2" max="6" value="3"> <span class="val" id="m2bval">3</span> 行</label>
          </div>
          <canvas id="m2canvas" width="720" height="420"></canvas>
          <div class="btn-row" style="justify-content:center;">
            <button class="btn" id="m2fill">🧱 铺一行</button>
            <button class="btn-secondary" id="m2split">✂️ 拆分模式</button>
            <button class="btn-secondary" id="m2clear">🔄 重来</button>
          </div>
          <div class="calc-display" id="m2calc"></div>
        </div>
      </template>

      <!-- ③ 分数披萨 -->
      <template id="tpl-m3">
        <div class="card">
          <h2>③ 分数的初步认识 · 披萨分一分</h2>
          <details class="lesson-hint">
            <summary>💡 不会做？点我看提示</summary>
            <p>拖动滑块改变份数，点击披萨上的每一块来"取走"它。</p>
          </details>
          <div class="controls" style="justify-content:center;margin-bottom:22px;">
            <label>平均分成 <input type="range" id="m3denRange" min="2" max="12" value="4"> <span class="val" id="m3denval">4</span> 份</label>
          </div>
          <div class="frac-wrap">
            <canvas id="m3canvas" width="340" height="340"></canvas>
            <div class="frac-info">
              <div class="frac"><span id="m3num">0</span><span class="line"></span><span id="m3denText">4</span></div>
              <div class="frac-text" id="m3text">还没有选任何一份</div>
            </div>
          </div>
          <div class="frac-extra">
            <div class="frac-extra-tabs">
              <button class="frac-tab active" data-frac-mode="compare">⚖️ 比大小</button>
              <button class="frac-tab" data-frac-mode="add">➕ 分数加法</button>
              <button class="frac-tab" data-frac-mode="sub">➖ 分数减法</button>
              <button class="frac-tab" data-frac-mode="equiv">🟰 等值分数</button>
            </div>
            <div id="fracExtraContent" class="frac-extra-content"></div>
          </div>
          <div class="btn-row" style="justify-content:center;">
            <button class="btn-secondary" id="m3clear">🔄 清空重选</button>
          </div>
        </div>
      </template>

      <!-- ④ 长度单位 -->
      <template id="tpl-m4">
        <div class="card">
          <h2>④ 毫米、分米和千米 · 单位换算器</h2>
          <details class="lesson-hint">
            <summary>💡 不会做？点我看提示</summary>
            <p>长度单位每相邻两个之间都是 10 倍关系（千米和米之间是 1000 倍）。</p>
          </details>
          <div class="ladder">
            <div class="rung"><span class="unit-name">千米</span><span class="unit-sym">km</span></div>
            <div class="arrow-row">↓ × 1000 &nbsp;&nbsp; ↑ ÷ 1000</div>
            <div class="rung"><span class="unit-name">米</span><span class="unit-sym">m</span></div>
            <div class="arrow-row">↓ × 10 &nbsp;&nbsp; ↑ ÷ 10</div>
            <div class="rung"><span class="unit-name">分米</span><span class="unit-sym">dm</span></div>
            <div class="arrow-row">↓ × 10 &nbsp;&nbsp; ↑ ÷ 10</div>
            <div class="rung"><span class="unit-name">厘米</span><span class="unit-sym">cm</span></div>
            <div class="arrow-row">↓ × 10 &nbsp;&nbsp; ↑ ÷ 10</div>
            <div class="rung"><span class="unit-name">毫米</span><span class="unit-sym">mm</span></div>
          </div>
          <div class="converter">
            <input type="text" inputmode="decimal" id="m4val" value="3">
            <select id="m4unit">
              <option value="km">千米</option><option value="m" selected>米</option>
              <option value="dm">分米</option><option value="cm">厘米</option>
              <option value="mm">毫米</option>
            </select>
            <span style="font-size:16px;font-weight:700;color:var(--muted);">= ?</span>
          </div>
          <div class="result-list" id="m4results"></div>
          <div class="quiz-box">
            <div class="quiz-q" id="m4quizq">点击下方按钮开始小测</div>
            <div class="quiz-row">
              <button class="btn" id="m4newq">🎲 出题</button>
              <input type="text" inputmode="decimal" id="m4answer" placeholder="答案">
              <button class="btn-secondary" id="m4check">✔ 检查</button>
            </div>
            <div class="feedback" id="m4fb" style="margin-top:14px;display:none;"></div>
          </div>
        </div>
      </template>

      <!-- ⑤ 面积周长 -->
      <template id="tpl-m5">
        <div class="card">
          <h2>⑤ 长方形和正方形的面积 · 围栏与地砖</h2>
          <details class="lesson-hint">
            <summary>💡 不会做？点我看提示</summary>
            <p>拖动滑块改变长和宽，观察面积和周长各自怎么变化。</p>
          </details>
          <div class="controls" style="justify-content:center;">
            <label>长 <input type="range" id="m5w" min="1" max="10" value="5"> <span class="val" id="m5wval">5</span></label>
            <label>宽 <input type="range" id="m5h" min="1" max="10" value="3"> <span class="val" id="m5hval">3</span></label>
          </div>
          <div class="grid-wrap"><div class="grid" id="m5grid"></div></div>
          <div class="stats">
            <div class="stat area"><div class="label">面积（方块数）</div><div class="value" id="m5area">15</div></div>
            <div class="stat perim"><div class="label">周长（边线长）</div><div class="value" id="m5perim">16</div></div>
          </div>
          <div class="btn-row" style="justify-content:center;">
            <button class="btn" id="m5record">📝 记录数据</button>
            <button class="btn-secondary" id="m5cleartable">🗑 清空表格</button>
          </div>
          <table class="data-table" id="m5table">
            <thead><tr><th>序号</th><th>长</th><th>宽</th><th>面积 = 长 × 宽</th><th>周长 = (长+宽) × 2</th></tr></thead>
            <tbody></tbody>
          </table>

          <div class="step-card" style="margin-top:24px;">
            <div class="step-title">
              <span class="step-num">🎯</span>逆向挑战
            </div>
            <div id="m5Challenge"></div>
            <div class="btn-row" style="justify-content:center;margin-top:12px;">
              <button class="btn" id="m5NewChallenge">🎲 出新题</button>
            </div>
          </div>
        </div>
      </template>

      <!-- ⑥ 小数认识 -->
      <template id="tpl-m6">
        <div class="card">
          <h2>⑥ 小数的初步认识 · 元角分</h2>
          <details class="lesson-hint">
            <summary>💡 不会做？点我看提示</summary>
            <p>1 元 = 10 角 = 100 分。往钱包里放硬币，看看一共是多少元。</p>
          </details>
          <div class="coin-row" id="m6coins"></div>
          <div class="money-display">
            <div class="money-big" id="m6total">0.00<small>元</small></div>
            <div class="money-sub" id="m6sub">还没有放硬币</div>
          </div>
          <div class="numline" id="m6numline"></div>
          <div class="btn-row" style="justify-content:center;">
            <button class="btn-secondary" id="m6clear">🔄 清空钱包</button>
          </div>
        </div>
      </template>

      <!-- ⑦ 时分秒 -->
      <template id="tpl-m7">
        <div class="card">
          <h2>⑦ 时、分、秒 · 时钟与秒表</h2>
          <details class="lesson-hint">
            <summary>💡 不会做？点我看提示</summary>
            <p>拖动分针或让秒针自动走，观察时分秒的关系。切换到秒表模式，体验正计时和倒计时。</p>
          </details>

          <div class="clock-wrap">
            <canvas id="m7canvas" width="320" height="320"></canvas>
            <div class="clock-info">
              <div class="clock-digital" id="m7digital">3:00:00</div>
              <div class="clock-chinese" id="m7chinese">三时整</div>
              <div class="btn-row" style="justify-content:center;">
                <button class="btn-secondary" id="m7toggle">⏸ 暂停</button>
                <button class="btn-secondary" id="m7sound">🔇 滴答声</button>
                <button class="btn-secondary" id="m7reset">🔄 回到 3:00</button>
              </div>
            </div>
          </div>

          <div class="stopwatch-panel">
            <div class="sw-tabs">
              <button class="sw-tab active" data-mode="clock">🕐 时钟模式</button>
              <button class="sw-tab" data-mode="up">⏱ 秒表正计时</button>
              <button class="sw-tab" data-mode="down">⏳ 秒表倒计时</button>
            </div>
            <div class="sw-display" id="swDisplay">00:00<small>.0</small></div>
            <div class="sw-controls" id="swControls">
              <button class="btn" id="swToggle">▶ 开始</button>
              <button class="btn-secondary" id="swReset">🔄 归零</button>
              <div class="sw-input-group" id="swSetup" style="display:none;">
                倒计时设置：
                <input type="text" inputmode="decimal" id="swMin" value="1"> 分
                <input type="text" inputmode="decimal" id="swSec" value="0"> 秒

                <div class="growth-card-stat"><div class="num">0<small>%</small></div><div class="lbl">正确率</div></div>
              </div>
              <div class="growth-card-cta">点击展开 ▾</div>
            </div>

            <div class="growth-card c-amber" data-goto="takeawaySection">
              <div class="growth-card-hd">
                <div class="growth-card-icon">💡</div>
                <div class="growth-card-title">
                  一题一得
                  <small>每道题的心得</small>
                </div>
              </div>
              <div class="growth-card-stats" id="takeawayStats">
                <div class="growth-card-stat"><div class="num">0<small>条</small></div><div class="lbl">心得</div></div>
              </div>
              <div class="growth-card-cta">点击展开 ▾</div>
            </div>

            <div class="growth-card c-green" data-goto="growthChartSection">
              <div class="growth-card-hd">
                <div class="growth-card-icon">📈</div>
                <div class="growth-card-title">
                  成长曲线
                  <small>最近 7 天的变化</small>
                </div>
              </div>
              <div class="growth-card-stats" id="growthChartStats">
                <div class="growth-card-stat"><div class="num">0<small>道</small></div><div class="lbl">本周做题</div></div>
                <div class="growth-card-stat"><div class="num">0<small>道</small></div><div class="lbl">做对</div></div>
                <div class="growth-card-stat"><div class="num">0<small>天</small></div><div class="lbl">学习天数</div></div>
              </div>
              <div class="growth-card-cta">点击展开 ▾</div>
            </div>

            <div class="growth-card c-teal" data-goto="streakTreeSection">
              <div class="growth-card-hd">
                <div class="growth-card-icon">🌱</div>
                <div class="growth-card-title">
                  打卡树
                  <small>每天进步一点点</small>
                </div>
              </div>
              <div class="growth-card-stats" id="streakTreeStats">
                <div class="growth-card-stat"><div class="num">0<small>天</small></div><div class="lbl">连续打卡</div></div>
                <div class="growth-card-stat"><div class="num">0<small>轮</small></div><div class="lbl">7天周期</div></div>
              </div>
              <div class="growth-card-cta">点击展开 ▾</div>
            </div>

            <div class="growth-card c-violet" data-goto="weeklyReportSection">
              <div class="growth-card-hd">
                <div class="growth-card-icon">📊</div>
                <div class="growth-card-title">
                  本周学习周报
                  <small>一周的表现</small>
                </div>
              </div>
              <div class="growth-card-stats" id="weeklyReportStats">
                <div class="growth-card-stat"><div class="num">0<small>道</small></div><div class="lbl">本周做题</div></div>
                <div class="growth-card-stat"><div class="num">0<small>%</small></div><div class="lbl">正确率</div></div>
                <div class="growth-card-stat"><div class="num">0<small>天</small></div><div class="lbl">学习天数</div></div>
              </div>
              <div class="growth-card-cta">点击展开 ▾</div>
            </div>
          </div>

          <div id="growthDetailPanels">
            <div id="errorProfilePanel" class="error-profile-panel" style="display:none;"></div>

            <div class="collapsible-section" id="historySection">
              <div class="collapsible-hd">
                <span class="collapse-icon">▶</span>
                <span class="collapse-title">📚 做题记录</span>
                <span class="collapse-count" id="historyCount">共 0 道</span>
              </div>
              <div class="collapsible-bd">
                <div id="historyList" class="history-list">
                  <div class="history-empty">还没有做题记录哦</div>
                </div>
                <div class="btn-row" style="justify-content:flex-end;margin-top:12px;">
                  <button class="btn-secondary" id="historyExport">📤 导出记录</button>
                  <button class="btn-secondary" id="historyClear">🗑 清空记录</button>
                </div>
              </div>
            </div>

            <div class="collapsible-section" id="takeawaySection">
              <div class="collapsible-hd">
                <span class="collapse-icon">▶</span>
                <span class="collapse-title">💡 一题一得 · 汇总</span>
                <span class="collapse-count" id="takeawayCount">0 条</span>
              </div>
              <div class="collapsible-bd">
                <div id="takeawayGalleryBox"></div>
              </div>
            </div>

            <div class="collapsible-section" id="growthChartSection">
              <div class="collapsible-hd">
                <span class="collapse-icon">▶</span>
                <span class="collapse-title">📈 最近 7 天成长曲线</span>
              </div>
              <div class="collapsible-bd">
                <div class="growth-bars" id="growthChartInline"></div>
              </div>
            </div>

            <div class="collapsible-section" id="streakTreeSection">
              <div class="collapsible-hd">
                <span class="collapse-icon">▶</span>
                <span class="collapse-title">🌱 打卡树</span>
                <span class="collapse-hint" id="streakTreeInlineLabel">已连续 0 天</span>
              </div>
              <div class="collapsible-bd">
                <div class="streak-dots" id="streakTreeInline"></div>
              </div>
            </div>

            <div class="collapsible-section" id="weeklyReportSection">
              <div class="collapsible-hd">
                <span class="collapse-icon">▶</span>
                <span class="collapse-title">📊 本周学习周报</span>
              </div>
              <div class="collapsible-bd">
                <div id="weeklyReportBox"></div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </main>
  </div>
</div>

<div id="page-growth" class="page">
  <div id="growthHeader" class="lesson-header"></div>
  <div id="growthStage" class="growth-stage"></div>
</div>

<div id="page-messages" class="page">
  <div id="messagesHeader" class="lesson-header"></div>
  <div id="messagesStage" class="messages-stage"></div>
</div>

<div id="page-settings" class="page">
  <div id="settingsHeader" class="lesson-header"></div>
  <div id="settingsStage" class="settings-stage"></div>
</div>

<button id="kojiBtn" class="koji-btn" title="Koji 助手" aria-label="Koji 助手">🤖</button>
<button id="wrongBookBtn" class="wrong-book-btn" title="错题本" aria-label="错题本">📕
  <span class="wrong-book-badge" id="wrongBookBadge" style="display:none;">0</span>
</button>

<div id="wrongBookDrawer" class="wrong-book-drawer">
  <div class="wrong-book-header">
    <span>📕 错题本</span>
    <button class="wrong-book-close" id="wrongBookClose">×</button>
  </div>
  <div id="wbRecommend" class="wb-recommend" style="display:none;"></div>
  <div class="wrong-book-list" id="wrongBookList"></div>
  <div class="wrong-book-footer">
    <button class="btn-secondary" id="wrongBookClear">🗑 清空错题本</button>
    <button class="btn-secondary" id="wrongBookExport">📤 导出</button>
  </div>
</div>
<div id="wrongBookMask" class="wrong-book-mask"></div>

<div id="explainModalMask" class="explain-modal-mask" style="display:none;">
  <div class="explain-modal">
    <div class="explain-modal-header">
      <h3>🧠 AI 讲解</h3>
      <button class="explain-modal-close" id="explainModalClose">×</button>
    </div>
    <div class="explain-modal-body" id="explainModalBody"></div>
  </div>
</div>

<script type="module">
  import { initGradeSelector, updateTitle } from './js/grade.js';
  initGradeSelector();
  updateTitle();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('✅ PWA 注册成功'))
        .catch(err => console.warn('❌ PWA 注册失败:', err));
    });
  }
</script>

</body>
