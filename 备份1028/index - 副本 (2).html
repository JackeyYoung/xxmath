<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老爸数学互动课堂 · 全模块</title>
<!-- 1. 依赖 -->
<!-- 1. 依赖：本地优先 -->
<script src="./js/localforage.min.js"></script>
<!-- 2. 数据（保持原样） -->

<script src="./js/cloudbase.full.js"></script>

<script type="module" src="./app/main.js"></script>

<style>

/* ============================================================
   0. Brilliant 风格全站统一变量 & 基础重置
   ============================================================ */
:root {
  /* 亮色模式（温和高级灰） */
  --primary: #22C55E;
  --primary-d: #16A34A;
  --primary-soft: #DCFCE7;
  --secondary: #3B82F6;
  
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --card-hover: #F1F5F9;
  
  --text: #0F172A;
  --text-soft: #334155;
  --muted: #64748B;
  
  --border: #E2E8F0;
  --border-soft: #F1F5F9;
  
  --green-soft: #DCFCE7; --green-text: #15803D;
  --red-soft: #FEE2E2;   --red-text: #B91C1C;
  --amber-soft: #FEF3C7; --amber-text: #92400E;
  --purple-soft: #F3E8FF; --purple-text: #6D28D9;
  
  --r-card: 16px;
  --r-pill: 999px;
  --r-sm: 10px;
  --input-bg: #FFFFFF;
}

[data-theme="dark"] {
  /* 深色模式（参考图极致深邃黑） */
  --primary: #22C55E;
  --primary-d: #16A34A;
  --primary-soft: rgba(34, 197, 94, 0.15);
  --secondary: #60A5FA;
  
  --bg: #09090B;
  --card: #18181B;
  --card-hover: #27272A;
  
  --text: #FAFAFA;
  --text-soft: #D4D4D8;
  --muted: #A1A1AA;
  
  --border: #27272A;
  --border-soft: #3F3F46;
  
  --green-soft: rgba(34, 197, 94, 0.15); --green-text: #4ADE80;
  --red-soft: rgba(239, 68, 68, 0.15);   --red-text: #F87171;
  --amber-soft: rgba(245, 158, 11, 0.15);--amber-text: #FBBF24;
  --purple-soft: rgba(168, 85, 247, 0.15);--purple-text: #C084FC;
  
  --input-bg: #09090B;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: 300px; }
html, body { min-height: 100%; overflow-x: hidden !important; overscroll-behavior-y: auto; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text-soft);
  padding-bottom: 60px;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .3s, color .3s;
}

/* ============================================================
   1. 全局表单/控件重置
   ============================================================ */
button, input, select, textarea {
  font-family: inherit; font-variant-numeric: tabular-nums; caret-color: var(--primary);
  color: var(--text) !important;
}
input, select, textarea {
  font-size: 16px; -webkit-appearance: none; appearance: none;
  background-color: var(--input-bg) !important;
  border: 1px solid var(--border) !important;
  border-radius: var(--r-sm); padding: 10px 14px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary) !important;
  box-shadow: 0 0 0 3px var(--primary-soft) !important;
}
input::placeholder, textarea::placeholder { color: var(--muted) !important; opacity: 0.6; }
select {
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
  background-repeat: no-repeat !important; background-position: right 12px center !important; background-size: 16px !important;
  padding-right: 40px !important; cursor: pointer;
}
button { cursor: pointer; border: none; background: none; transition: all .15s; }
button:active:not(:disabled) { transform: scale(.97); }

/* ============================================================
   2. 排版与通用组件
   ============================================================ */
.app-header { text-align: center; padding: 32px 16px 20px; }
.app-header h1 { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
.app-header p { margin-top: 8px; font-size: 14px; color: var(--muted); letter-spacing: 2px; }

.page { display: none !important; min-height: calc(100vh - 60px); padding-bottom: 100px; }
.page.active { display: block !important; animation: pageIn .28s cubic-bezier(.34,1.3,.64,1); }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card);
  padding: 24px; width: 100%; box-sizing: border-box; animation: cardIn .35s ease;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.card h2 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.card .sub { font-size: 13.5px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }

.btn {
  padding: 12px 24px; border-radius: var(--r-pill); background: var(--primary); color: #fff !important;
  font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-secondary {
  padding: 12px 24px; border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--card); color: var(--text-soft); font-size: 15px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-secondary:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

/* ============================================================
   3. 首页（Home）
   ============================================================ */
.home-wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }
.home-hero {
  width: 100%; text-align: left; padding: 24px; margin-bottom: 24px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card);
  display: flex; flex-direction: column; align-items: flex-start;
}
.home-hero-kicker { color: var(--primary); font-size: 12px; font-weight: 700; margin-bottom: 8px; }
.home-hero-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
.home-hero-meta { color: var(--muted); font-size: 13.5px; margin-bottom: 16px; }
.home-hero-cta { padding: 10px 24px; background: var(--primary); color: #fff !important; border-radius: var(--r-pill); font-size: 14px; font-weight: 600; }

.island-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
.island { text-align: left; border: 1px solid var(--border); background: var(--card); border-radius: var(--r-card); padding: 16px; cursor: pointer; }
.island:hover { border-color: var(--primary); background: var(--card-hover); }
.island-icon { font-size: 24px; margin-bottom: 12px; display: inline-block; padding: 8px; background: var(--bg); border-radius: 12px; }
.island-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.island-desc { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.island-progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
.island-progress span { display: block; height: 100%; background: var(--primary); }
.island-meta { font-size: 11.5px; color: var(--muted); font-weight: 600; }

.home-tasks { background: transparent; border: none; margin-bottom: 24px; padding: 0; }
.home-tasks-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
.home-tasks-hd span:first-child { font-size: 16px; font-weight: 700; color: var(--text); }
.home-tasks-count { font-size: 13px; font-weight: 600; color: var(--muted); background: var(--card); padding: 2px 10px; border-radius: var(--r-pill); border: 1px solid var(--border); }
.home-tasks-list { display: flex; flex-direction: column; gap: 8px; }
.home-task { width: 100%; display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card); cursor: pointer; text-align: left; }
.home-task:hover { border-color: var(--border-soft); }
.home-task-icon { flex-shrink: 0; font-size: 18px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--bg); }
.home-task-body { flex: 1; min-width: 0; }
.home-task-title { font-size: 15px; font-weight: 700; color: var(--text); }
.home-task-desc { font-size: 12.5px; color: var(--muted); margin: 4px 0; }
.home-task-progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.home-task-progress span { display: block; height: 100%; background: var(--primary); }
.home-task.done { border-color: var(--primary); background: var(--green-soft); }
.home-task.done .home-task-icon { background: rgba(34, 197, 94, 0.2); }
.home-task.done .home-task-title, .home-task.done .home-task-desc, .home-task.done .home-task-arrow { color: var(--green-text); }

.home-week { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card); margin-bottom: 24px; padding: 20px; }
.home-week-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.home-week-hd span:first-child { font-size: 16px; font-weight: 700; color: var(--text); }
.home-week-days { display: flex; gap: 8px; justify-content: space-between; margin-bottom: 16px; }
.home-week-day { flex: 1; display: flex; flex-direction: column; align-items: center; }
.home-week-dot { width: 32px; height: 32px; margin-bottom: 8px; border-radius: 50%; background: var(--bg); color: var(--muted); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
.home-week-day.active .home-week-dot { background: var(--primary); color: #fff !important; border-color: var(--primary); }
.home-week-label { font-size: 12px; color: var(--muted); font-weight: 600; }
.home-week-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.home-week-bar span { display: block; height: 100%; background: var(--primary); }

.home-recommend { display: flex; align-items: center; gap: 16px; width: 100%; padding: 16px 20px; background: var(--amber-soft); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: var(--r-card); margin-bottom: 20px; }
.home-recommend-icon { flex-shrink: 0; font-size: 24px; }
.home-recommend-body { flex: 1; font-size: 14px; color: var(--amber-text); font-weight: 600; }
.home-recommend-cta { flex-shrink: 0; padding: 8px 20px; background: var(--amber-text); color: #000 !important; border-radius: var(--r-pill); font-size: 13px; font-weight: 700; }

.home-growth-entry, .home-messages-entry, .home-settings-entry {
  width: 100%; margin-top: 12px; padding: 16px; border-radius: var(--r-card); font-size: 14px; font-weight: 700;
  border: 1px solid var(--border); background: var(--card); color: var(--text-soft);
  display: flex; justify-content: center; align-items: center;
}
.home-growth-entry:hover, .home-messages-entry:hover, .home-settings-entry:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

/* ============================================================
   4. 课页（Lesson）与通用组件
   ============================================================ */
.lesson-header { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 12px; padding: max(10px, env(safe-area-inset-top)) 16px 10px; background: var(--bg); border-bottom: 1px solid var(--border); }
.lesson-back, .lesson-more { width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--card); border: 1px solid var(--border); color: var(--text-soft); font-size: 18px; display: flex; align-items: center; justify-content: center; }
.lesson-title { flex: 1; font-size: 16px; font-weight: 700; color: var(--text); }
.lesson-progress { max-width: 1200px; margin: 0 auto; padding: 10px 16px 14px; font-size: 13px; color: var(--muted); font-weight: 600; position: relative; }
.lesson-progress-bar { position: absolute; left: 16px; right: 16px; bottom: 4px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.lesson-progress-bar span { display: block; height: 100%; background: var(--primary); transition: width .45s ease; }
.lesson-stage { max-width: 1200px; margin: 0 auto; padding: 16px; }

/* M1 混合运算 */
.expr-box { background: var(--bg); border: 1px dashed var(--border); border-radius: var(--r-card); padding: 24px 12px; display: flex; align-items: center; justify-content: center; }
.expr { display: flex; gap: 12px 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.token { display: inline-flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; min-width: 44px; height: 52px; border-radius: var(--r-sm); padding: 0 10px; border: 1px solid var(--border); }
.token.num { background: var(--card); color: var(--text); }
.token.op { background: var(--primary); color: #fff !important; border-color: var(--primary); cursor: pointer; }

/* M13 解题思维 */
.problem-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
#problem-text { min-height: 60px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 15px; padding: 12px 16px; background: var(--input-bg); }
.m13-step { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card); margin-bottom: 12px; overflow: hidden; }
.m13-step.completed { border-color: var(--primary); background: var(--green-soft); }
.m13-step-hd { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: var(--bg); font-weight: 700; color: var(--text); }
.m13-step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; }
.m13-step.completed .m13-step-num { background: var(--primary); color: #fff !important; }
.m13-step-bd { padding: 16px 14px; border-top: 1px dashed var(--border); }

/* ============================================================
   5. 我的成长 & 错题本（图表与列表净化）
   ============================================================ */
#page-growth, #growthStage { background: var(--bg) !important; }
.growth-weekly-tip { background: var(--card) !important; border: 1px solid var(--border) !important; color: var(--text-soft) !important; border-radius: var(--r-sm) !important; padding: 16px 20px !important; margin-bottom: 20px !important; font-size: 14px !important; }

.weekly-summary { background: var(--card) !important; border: 1px solid var(--border) !important; border-radius: var(--r-card) !important; padding: 24px !important; }
.weekly-summary-hd { color: var(--text) !important; font-size: 18px !important; border-bottom: 1px dashed var(--border) !important; padding-bottom: 16px !important; margin-bottom: 20px !important; display: flex !important; justify-content: space-between !important; }
.weekly-summary-stats { display: grid !important; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)) !important; gap: 12px !important; margin-bottom: 24px !important; }
.weekly-stat { background: var(--bg) !important; border: 1px solid var(--border) !important; border-radius: var(--r-sm) !important; padding: 16px 8px !important; text-align: center !important; display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; }
.weekly-stat-value { color: var(--text) !important; font-size: 26px !important; font-weight: 800 !important; font-family: monospace !important; }
.weekly-stat-label { color: var(--muted) !important; font-size: 12px !important; margin-top: 6px !important; }
.weekly-summary-section-title { color: var(--text) !important; font-size: 14px !important; margin-bottom: 10px !important; display: block !important; }
.weekly-summary-tag { background: var(--bg) !important; border: 1px solid var(--border) !important; color: var(--text-soft) !important; padding: 6px 12px !important; border-radius: var(--r-pill) !important; font-size: 13px !important; }
.weekly-mastered-item { background: var(--bg) !important; border: 1px solid var(--border) !important; border-radius: var(--r-sm) !important; color: var(--text-soft) !important; padding: 10px 14px !important; display: flex !important; align-items: center !important; }

.wrong-book-drawer { background: var(--bg) !important; border-left: 1px solid var(--border) !important; }
.wrong-book-header { background: var(--card) !important; border-bottom: 1px solid var(--border) !important; padding: 16px 20px !important; }
.wrong-item { background: var(--card) !important; border: 1px solid var(--border) !important; border-left: 3px solid var(--red-text) !important; border-radius: var(--r-sm) !important; padding: 16px !important; margin-bottom: 12px !important; }
.wrong-item-text { color: var(--text) !important; font-size: 15px !important; line-height: 1.6 !important; }
.wrong-item-meta span, .wrong-item-tag-chip { background: var(--bg) !important; color: var(--muted) !important; border: 1px solid var(--border) !important; border-radius: 4px !important; padding: 2px 8px !important; }
.wrong-item[data-wrong-count]::after { background: var(--red-soft) !important; color: var(--red-text) !important; border: none !important; }
.wrong-item-explain, .wrong-item-redo { background: var(--bg) !important; border: 1px solid var(--border) !important; color: var(--text-soft) !important; border-radius: var(--r-pill) !important; padding: 6px 14px !important; }

/* 月对比 & 成就墙 */
.month-compare, .achievement-wall { background: var(--card) !important; border: 1px solid var(--border) !important; border-radius: var(--r-card) !important; padding: 20px !important; margin-top: 16px; }
.month-compare-hd, .achievement-wall-hd { color: var(--text) !important; font-size: 16px !important; border-bottom: 1px dashed var(--border) !important; padding-bottom: 12px !important; margin-bottom: 16px !important; display: flex !important; justify-content: space-between !important; }
.month-compare-grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 12px !important; }
.month-row { display: flex !important; flex-direction: column !important; padding: 16px !important; background: var(--bg) !important; border: 1px solid var(--border) !important; border-radius: var(--r-sm) !important; }
.month-label { font-size: 13px !important; color: var(--muted) !important; margin-bottom: 6px !important; }
.month-value { font-size: 24px !important; font-weight: 800 !important; color: var(--text) !important; font-family: monospace !important; }
.achievement-grid { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)) !important; gap: 12px !important; }
.achievement-item { display: flex !important; flex-direction: column !important; align-items: center !important; background: var(--bg) !important; border: 1px solid var(--border) !important; border-radius: var(--r-sm) !important; padding: 16px !important; }
.achievement-star { font-size: 28px !important; margin-bottom: 8px !important; }
.achievement-text { font-size: 13px !important; color: var(--text-soft) !important; font-family: monospace !important; }

/* 历史记录 */
.history-item { background: var(--card) !important; border: 1px solid var(--border) !important; border-radius: var(--r-sm) !important; margin-bottom: 12px !important; }
.history-hd { background: var(--card) !important; border-bottom: 1px dashed var(--border) !important; padding: 16px !important; }
.history-problem { color: var(--text) !important; }
.history-bd { background: var(--bg) !important; padding: 16px !important; border-top: 1px dashed var(--border) !important; }

/* 弹窗与浮层 */
.student-modal-mask, .pwd-modal-mask, .explain-modal-mask, .export-modal-mask, .share-card-mask, .grade-modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10001; padding: 20px; }
.student-modal, .pwd-modal, .grade-modal, .export-modal, .share-card, .explain-modal { background: var(--card); border-radius: var(--r-card); padding: 24px; color: var(--text); border: 1px solid var(--border); }
.wrong-book-btn { position: fixed; bottom: 50px; right: 24px; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--red-text); display: flex; align-items: center; justify-content: center; font-size: 24px; z-index: 998; }
.koji-btn { position: fixed; bottom: 50px; right: 88px; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--purple-text); display: flex; align-items: center; justify-content: center; font-size: 24px; z-index: 998; }

/* 移动端修复 */
@media (max-width: 600px) {
  .home-hero { padding: 20px; }
  .island-grid { grid-template-columns: repeat(2, 1fr); }
  .island-desc { display: none; }
  .home-task { padding: 12px; }
  .weekly-summary-stats { grid-template-columns: repeat(2, 1fr) !important; }
  .month-compare-grid { grid-template-columns: 1fr !important; }
  .wrong-book-btn { width: 44px; height: 44px; bottom: 46px; right: 24px; font-size: 20px; }
  .koji-btn { width: 44px; height: 44px; bottom: 46px; right: 78px; font-size: 18px; }
}

/* ============================================================
   ⭐ 彻底修复：错题本抽屉的物理遮挡与层级
   ============================================================ */

/* 1. 错题本抽屉：固定定位，禁止被内部内容撑破 */
.wrong-book-drawer {
  position: fixed !important;
  top: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  width: 400px !important;
  max-width: 100vw !important;
  background: var(--card) !important; /* 必须有实色背景 */
  border-left: 1px solid var(--border) !important;
  box-shadow: -10px 0 30px rgba(0,0,0,0.2) !important;
  z-index: 9999 !important;
  transform: translateX(100%) !important; /* 默认隐藏 */
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
  display: flex !important;
  flex-direction: column !important;
}
.wrong-book-drawer.open {
  transform: translateX(0) !important;
}

/* 2. 遮罩层：必须在抽屉下方，挡住首页内容 */
.wrong-book-mask {
  position: fixed !important;

<div class="app-header" id="globalHeader">

</div>
<!-- 新增：三个 page 容器 -->
<div id="page-home"   class="page active"></div>
  
<div id="page-lesson" class="page">
  <div id="lessonHeader" class="lesson-header"></div>
  <div id="lessonProgress" class="lesson-progress"></div>   <!-- ⭐ 新增 -->

  <!-- ⭐ modulePool 就是 lesson 内容区，不再需要 lessonStage -->

    <main id="lesson-stage-main">
      <!-- 这里现在什么都不用放，等着 m1.js 动态挂载 -->
    </main>
    <!-- ① 混合运算 -->
    <template id="tpl-m1">
      <div class="card">
        <h2>① 混合运算 · 步步为营</h2>
        <details class="lesson-hint">
          <summary>💡 不会做？点我看提示</summary>

        </details>

        <div class="problem-bar">
          <select id="m1Select"></select>
          <button class="btn" id="m1Load">📥 载入</button>

          <button class="btn-secondary" id="m1UseCustom">使用</button>

          <button class="btn-secondary" id="m1Random">🎲 随机出题</button>

        <div class="btn-row">
          <button class="btn-secondary" id="m1reset">🔄 重来一次</button>
        </div>
      </div>

    <!-- ② 乘法面积 -->
